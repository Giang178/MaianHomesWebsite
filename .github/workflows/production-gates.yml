name: production-gates

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    env:
      SECRET_KEY: ci-only-secret-key-with-more-than-forty-eight-random-characters
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - run: python -m compileall -q app scripts
      - run: python -m unittest discover -s tests -p "test*.py"
      - run: python -m pytest -q
      - run: ruff check app scripts tests --select F821,F841
      - run: python -c "from app.main import app; schema=app.openapi(); assert '/api/protected/hr/performance' not in schema['paths']; assert '/api/protected/hr/leave/requests' not in schema['paths']"
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24.14.1", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build --build-arg APP_RELEASE=${{ github.sha }} -t maian-backend:${{ github.sha }} backend
      - run: docker build -t maian-frontend:${{ github.sha }} frontend
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: maian-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Docker Compose smoke test
        env:
          S3_ACCESS_KEY: ci-minio-user
          S3_SECRET_KEY: ci-minio-password-strong
          CEO_EMAIL: ceo.compose-ci@maianhomes.vn
          CEO_FULL_NAME: CEO Kiểm thử Compose
          BACKEND_RELEASE_ID: ${{ github.sha }}
          BACKEND_BLUE_RELEASE: ${{ github.sha }}
          BACKEND_GREEN_RELEASE: ${{ github.sha }}
          BACKEND_WORKER_RELEASE: ${{ github.sha }}
          BACKEND_RELEASE_IMAGE: maian-backend:${{ github.sha }}
          BACKEND_BLUE_IMAGE: maian-backend:${{ github.sha }}
          BACKEND_GREEN_IMAGE: maian-backend:${{ github.sha }}
          BACKEND_WORKER_IMAGE: maian-backend:${{ github.sha }}
          FRONTEND_BLUE_IMAGE: maian-frontend:${{ github.sha }}
          FRONTEND_GREEN_IMAGE: maian-frontend:${{ github.sha }}
          CEO_PHONE: "0900000003"
          CEO_BOOTSTRAP_PASSWORD: Compose-Ci-Bootstrap-2026!
        run: |
          cat > .env.ci <<'EOF'
          ENVIRONMENT=test
          SECRET_KEY=ci-only-secret-key-with-more-than-forty-eight-random-characters
          MONGODB_URL=mongodb://mongo1:27017/maian_ci?replicaSet=rs0
          DATABASE_NAME=maian_ci
          ENSURE_INDEXES_ON_STARTUP=false
          REDIS_URL=redis://redis:6379/0
          RATE_LIMIT_STORAGE_URI=redis://redis:6379/1
          ACTIVITY_EMBEDDED_JOBS=false
          WS_ALLOW_QUERY_TOKEN=false
          CONSIGNMENT_ENABLED=true
          S3_ENABLED=true
          S3_ENDPOINT_URL=http://minio:9000
          S3_ACCESS_KEY=ci-minio-user
          S3_SECRET_KEY=ci-minio-password-strong
          S3_BUCKET=maian-ci
          MALWARE_SCAN_ENABLED=true
          CLAMAV_HOST=clamav
          PASSWORD_RESET_ENABLED=false
          ACCOUNT_CREDENTIAL_DELIVERY_ENABLED=false
          CEO_EMAIL=ceo.compose-ci@maianhomes.vn
          CEO_FULL_NAME=CEO Kiểm thử Compose
          CEO_PHONE=0900000003
          CEO_BOOTSTRAP_PASSWORD=Compose-Ci-Bootstrap-2026!
          ENFORCE_FIRST_LOGIN_CHANGE=false
          WORKER_HEALTH_REQUIRED=true
          ALLOWED_ORIGINS=http://localhost
          EOF
          docker compose config --quiet
          docker compose --profile ollama config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet
          docker compose up -d --build --wait --wait-timeout 360
          docker compose exec -T api1 python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"
      - if: always()
        env:
          S3_ACCESS_KEY: ci-minio-user
          S3_SECRET_KEY: ci-minio-password-strong
          CEO_EMAIL: ceo.compose-ci@maianhomes.vn
          CEO_FULL_NAME: CEO Kiểm thử Compose
          CEO_PHONE: "0900000003"
          CEO_BOOTSTRAP_PASSWORD: Compose-Ci-Bootstrap-2026!
        run: docker compose down -v --remove-orphans
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: maian-frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
